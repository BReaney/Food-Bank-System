name: Full-stack build and acceptance tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Disposable fixture database. Never use real account credentials here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foodbank_app
          POSTGRES_PASSWORD: ci_fixture_only_password
          POSTGRES_DB: foodbank_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodbank_app -d foodbank_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: foodbank_dev
      PGUSER: foodbank_app
      PGPASSWORD: ci_fixture_only_password
      ENABLE_PROTOTYPE_AUTH: 'true'
      FRONTEND_ORIGIN: http://localhost:5173
      DEMO_STAFF_PASSWORD: OnlyForCI_Staff_12345
      DEMO_STUDENT_PASSWORD: OnlyForCI_Student_12345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate documentation links and README contents
        run: node testing/documentation/checkLinks.mjs

      - name: Test calendar UI state guards
        working-directory: frontend
        run: npm run test:calendar-state

      - name: Test role-scoped page navigation
        working-directory: frontend
        run: npm run test:navigation

      - name: Prepare fictional database and accounts
        working-directory: backend
        run: |
          npm run test:db-setup
          npm run seed:demo-accounts

      - name: Run authentication API smoke tests
        working-directory: backend
        run: |
          npm run dev > /tmp/uvss-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:auth
          npm run test:eligibility
          npm run test:pagination
          npm run test:booking-management
          npm run test:household
          npm run test:calendar
          npm run test:staff-outcomes
          npm run test:reporting
          npm run test:staff-records
          npm run test:acceptance

      - name: Upload acceptance results (even when assertions fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsd-acceptance-results
          path: testing/results/latest-run.*
          if-no-files-found: warn
